<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="Rolls of flexible packaging film">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123055"/>
      <stop offset="55%" stop-color="#0b213c"/>
      <stop offset="100%" stop-color="#061527"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fa8c4"/>
      <stop offset="18%" stop-color="#e8eef6"/>
      <stop offset="38%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#cfdbe9"/>
      <stop offset="80%" stop-color="#f4f8fc"/>
      <stop offset="100%" stop-color="#7e97b4"/>
    </linearGradient>
    <linearGradient id="film2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f88a6"/>
      <stop offset="25%" stop-color="#dbe5f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#b9cade"/>
      <stop offset="100%" stop-color="#5f7997"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0bd8b"/>
      <stop offset="100%" stop-color="#a06f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8b483" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#d8b483" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061527" stop-opacity="0"/>
      <stop offset="100%" stop-color="#061527" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="900" fill="url(#bg)"/>
  <rect width="800" height="900" fill="url(#grid)"/>
  <circle cx="620" cy="250" r="330" fill="url(#glow)"/>

  <!-- Fine technical registration lines -->
  <g stroke="#d8b483" stroke-opacity=".25" stroke-width="1" fill="none">
    <path d="M60 160h120M60 160v120"/>
    <path d="M740 700h-120M740 700v-120"/>
    <circle cx="120" cy="700" r="42" stroke-dasharray="3 6"/>
  </g>
  <g fill="#d8b483" fill-opacity=".55" font-family="monospace" font-size="12" letter-spacing="2">
    <text x="60" y="145">BOPP / BOPET</text>
    <text x="60" y="300" transform="rotate(-90 60 300)">8 – 500 µm</text>
    <text x="620" y="690">HEFEI · CN</text>
  </g>

  <!-- Large upright film roll -->
  <g transform="translate(150 250)">
    <ellipse cx="210" cy="30" rx="210" ry="58" fill="#f2f6fb"/>
    <ellipse cx="210" cy="30" rx="210" ry="58" fill="none" stroke="#ffffff" stroke-opacity=".8"/>
    <path d="M0 30V470a210 58 0 0 0 420 0V30" fill="url(#film)"/>
    <path d="M0 30V470a210 58 0 0 0 420 0V30" fill="none" stroke="#ffffff" stroke-opacity=".35"/>
    <!-- specular streaks -->
    <path d="M78 34V474" stroke="#ffffff" stroke-opacity=".55" stroke-width="10"/>
    <path d="M300 34V474" stroke="#ffffff" stroke-opacity=".22" stroke-width="16"/>
    <ellipse cx="210" cy="30" rx="210" ry="58" fill="none" stroke="#9db2ca" stroke-opacity=".5" stroke-width="2"/>
    <ellipse cx="210" cy="30" rx="46" ry="13" fill="#0b213c"/>
    <ellipse cx="210" cy="30" rx="46" ry="13" fill="none" stroke="#d8b483" stroke-opacity=".7" stroke-width="2"/>
  </g>

  <!-- Second roll, lying -->
  <g transform="translate(430 560)">
    <ellipse cx="170" cy="150" rx="170" ry="82" fill="url(#film2)" transform="rotate(-14 170 150)"/>
    <ellipse cx="170" cy="150" rx="170" ry="82" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" transform="rotate(-14 170 150)"/>
    <ellipse cx="170" cy="150" rx="42" ry="20" fill="#0b213c" transform="rotate(-14 170 150)"/>
    <ellipse cx="170" cy="150" rx="42" ry="20" fill="none" stroke="#d8b483" stroke-opacity=".65" stroke-width="2" transform="rotate(-14 170 150)"/>
  </g>

  <!-- Copper accent ribbon -->
  <path d="M-20 520C180 470 300 610 500 540S760 400 840 440" fill="none" stroke="url(#copper)" stroke-opacity=".55" stroke-width="2"/>

  <rect y="600" width="800" height="300" fill="url(#fade)"/>
</svg>
